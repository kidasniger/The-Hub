name: Build, Tag and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: v1.0.0). Laisser vide pour génération automatique.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK, Tag & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Environment, Keystores & Firebase
        run: |
          # 1. Ensure .env exists for the secrets gradle plugin
          touch .env

          # 2. Ensure google-services.json exists
          if [ ! -f app/google-services.json ]; then
            echo "Restoring app/google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "183373607979",
              "project_id": "the-hub-f95f4",
              "storage_bucket": "the-hub-f95f4.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:183373607979:android:ab8055f86cb765a66de66e",
                  "android_client_info": {
                    "package_name": "com.thehub.hb"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDEhYwtXx6PejTL2RbJcjpzCBKkJPYLAtg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 3. Ensure debug.keystore ALWAYS exists for debugConfig
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Ensure release keystore exists for signingConfigs.release
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom signing keystore from secrets.KEYSTORE_BASE64"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating upload keystore (my-upload-key.jks) with keytool..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=The Hub,O=The Hub,C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Determine Tag & Version
        id: version_step
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "1.0")
            TAG="v${VERSION_NAME}.${{ github.run_number }}"
          fi
          echo "Computed Release Tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Compile and Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon

          # Attempt release build if keystore is present
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Building assembleRelease..."
            ./gradlew assembleRelease --no-daemon || echo "Release build failed or skipped, will package debug APK"
          fi

      - name: Package Artifacts for Release
        run: |
          mkdir -p release-artifacts

          # Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/TheHub-${TAG}-debug.apk"
            # If no release apk exists, make this the main apk
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/TheHub-${TAG}.apk"
          fi

          # Release APK (if generated)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/TheHub-${TAG}.apk"
          fi

          # Bundle AAB (if generated)
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/TheHub-${TAG}.aab"
          fi

          echo "Files prepared for release:"
          ls -la release-artifacts/

      - name: Create Git Tag (if not already tagged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag $TAG..."
            git tag -a "$TAG" -m "Automated Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists on remote."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "The Hub - Release ${{ env.TAG }}"
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
