name: Build, Tag and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: v1.0.0). Laisser vide pour génération automatique.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Firebase & Local Environment
        run: |
          touch .env
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring app/google-services.json from secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi

      - name: Validate Firebase Configuration Integrity
        run: |
          python3 -c '
          import json, sys, os

          path = "app/google-services.json"
          if not os.path.exists(path):
              print(f"ERROR: {path} is missing!")
              sys.exit(1)

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"ERROR: Failed to parse {path} as JSON: {e}")
              sys.exit(1)

          project_id = data.get("project_info", {}).get("project_id")
          if project_id != "the-hub-f95f4":
              print(f"ERROR: Invalid project_id: \"{project_id}\" (expected \"the-hub-f95f4\")")
              sys.exit(1)

          matching_client = next((c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.thehub.hb"), None)
          if not matching_client:
              print("ERROR: No client entry found for package_name \"com.thehub.hb\"")
              sys.exit(1)

          oauth_clients = matching_client.get("oauth_client", [])
          has_android_client = any(
              oc.get("client_type") == 1 and
              oc.get("android_info", {}).get("package_name") == "com.thehub.hb"
              for oc in oauth_clients
          )
          if not has_android_client:
              print("ERROR: Missing Android OAuth client (client_type 1) for com.thehub.hb")
              sys.exit(1)

          web_client_id = "183373607979-d1qu0ogpl24dptctim56nlght54hs8a7.apps.googleusercontent.com"
          has_web_client = any(
              oc.get("client_type") == 3 and oc.get("client_id") == web_client_id
              for oc in oauth_clients
          )
          if not has_web_client:
              print(f"ERROR: Missing Web OAuth client (client_type 3 with ID {web_client_id})")
              sys.exit(1)

          print("SUCCESS: google-services.json verified!")
          '

      - name: Determine Tag & Version
        id: version_step
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          CLEAN_VER="${TAG#v}"
          echo "Release Tag: $TAG (versionName: $CLEAN_VER, versionCode: ${{ github.run_number }})"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CLEAN_VER=$CLEAN_VER" >> "$GITHUB_ENV"

          sed -i "s/versionName = .*/versionName = \"$CLEAN_VER\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts

      - name: Validate Production Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is required for release builds."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is required for release builds."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is required for release builds."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is required for release builds."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "ERROR: Production keystore could not be decoded or is empty."
            exit 1
          fi

          if ! keytool -list -keystore app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: Production keystore credentials are invalid or KEY_ALIAS does not exist."
            exit 1
          fi

          echo "KEYSTORE_PATH=keystore.jks" >> "$GITHUB_ENV"
          echo "Production release signing configuration validated."

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Build Release AAB (Android App Bundle)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-configuration-cache

      - name: Verify Artifacts, Signing & Integrity
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK_FILE" || { echo "ERROR: APK missing or empty"; exit 1; }
          test -s "$AAB_FILE" || { echo "ERROR: AAB missing or empty"; exit 1; }

          EXPECTED_CERT_SHA1="F5:CD:8C:88:C4:C8:5F:D5:91:84:21:57:06:DA:52:C6:2C:57:D0:37"
          apksigner verify --verbose --print-certs "$APK_FILE" > apk-cert.txt
          cat apk-cert.txt
          grep -qi "$EXPECTED_CERT_SHA1" apk-cert.txt || {
            echo "ERROR: APK signing certificate changed. Release signing continuity would be broken."
            exit 1
          }

          jarsigner -verify -verbose -certs "$AAB_FILE" >/tmp/aab-signature.txt 2>&1 || {
            cat /tmp/aab-signature.txt
            echo "ERROR: AAB signature verification failed"
            exit 1
          }

          cp "$APK_FILE" "release-artifacts/TheHub-${TAG}.apk"
          cp "$AAB_FILE" "release-artifacts/TheHub-${TAG}.aab"
          sha256sum release-artifacts/*

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "The Hub ${{ env.TAG }}"
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
