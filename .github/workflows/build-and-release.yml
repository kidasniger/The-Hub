name: Build, Tag and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: v1.0.0). Laisser vide pour génération automatique.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: the-hub-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    name: Build, Test & Release Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Firebase & Local Environment
        run: |
          touch .env
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring app/google-services.json from secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi

      - name: Validate Firebase Configuration Integrity
        run: |
          python3 -c '
          import json, sys, os

          path = "app/google-services.json"
          if not os.path.exists(path):
              print(f"ERROR: {path} is missing!")
              sys.exit(1)

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"ERROR: Failed to parse {path} as JSON: {e}")
              sys.exit(1)

          project_id = data.get("project_info", {}).get("project_id")
          if project_id != "the-hub-f95f4":
              print(f"ERROR: Invalid project_id: \"{project_id}\" (expected \"the-hub-f95f4\")")
              sys.exit(1)

          matching_client = next((c for c in data.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.thehub.hb"), None)
          if not matching_client:
              print("ERROR: No client entry found for package_name \"com.thehub.hb\"")
              sys.exit(1)

          oauth_clients = matching_client.get("oauth_client", [])
          has_android_client = any(
              oc.get("client_type") == 1 and
              oc.get("android_info", {}).get("package_name") == "com.thehub.hb"
              for oc in oauth_clients
          )
          if not has_android_client:
              print("ERROR: Missing Android OAuth client (client_type 1) for com.thehub.hb")
              sys.exit(1)

          web_client_id = "183373607979-d1qu0ogpl24dptctim56nlght54hs8a7.apps.googleusercontent.com"
          has_web_client = any(
              oc.get("client_type") == 3 and oc.get("client_id") == web_client_id
              for oc in oauth_clients
          )
          if not has_web_client:
              print(f"ERROR: Missing Web OAuth client (client_type 3 with ID {web_client_id})")
              sys.exit(1)

          print("SUCCESS: google-services.json verified!")
          '

      - name: Determine and validate release version
        id: version_step
        env:
          GH_TOKEN: \${{ github.token }}
          REQUESTED_TAG: \${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess

          VERSION_FILE = "gradle/version.properties"
          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          TAG_RE = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

          def read_props():
              data = {}
              with open(VERSION_FILE, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          key, value = line.split("=", 1)
                          data[key.strip()] = value.strip()
              return data

          def parse(value, regex, label):
              match = regex.fullmatch(value)
              if not match:
                  raise SystemExit("VERSIONING ERROR: invalid " + label + ": " + value)
              return tuple(map(int, match.groups()))

          def version_code(value):
              return value[0] * 1000000 + value[1] * 1000 + value[2]

          def tag_for(value):
              return "v%d.%d.%d" % value

          current_props = read_props()
          current_name = current_props.get("versionName", "")
          current = parse(current_name, SEMVER, "versionName")
          current_code = int(current_props.get("versionCode", "0"))
          if current_code != version_code(current):
              raise SystemExit("VERSIONING ERROR: versionCode=" + str(current_code) + " does not match versionName=" + current_name)

          latest_tag = subprocess.check_output(
              ["gh", "release", "list", "--limit", "1", "--exclude-drafts", "--exclude-pre-releases", "--json", "tagName", "--jq", ".[0].tagName // empty"],
              text=True,
          ).strip()
          latest = parse(latest_tag, TAG_RE, "latest release tag") if latest_tag else None

          requested = os.environ.get("REQUESTED_TAG", "").strip()
          if requested:
              candidate = parse(requested, TAG_RE, "requested release tag")
          elif latest is None:
              candidate = current
          elif current > latest:
              candidate = current
          else:
              candidate = (latest[0], latest[1], latest[2] + 1)

          if latest is not None and candidate <= latest:
              raise SystemExit("VERSIONING ERROR: " + tag_for(candidate) + " is not newer than " + latest_tag)

          candidate_name = "%d.%d.%d" % candidate
          candidate_code = version_code(candidate)
          with open(VERSION_FILE, "w", encoding="utf-8", newline="\n") as f:
              f.write("# Single source of truth for the Android application version.\n")
              f.write("# versionName is MAJOR.MINOR.PATCH.\n")
              f.write("# versionCode is derived from the same SemVer tuple and validated by Gradle and CI.\n")
              f.write("versionName=" + candidate_name + "\n")
              f.write("versionCode=" + str(candidate_code) + "\n")

          print("Latest release:", latest_tag or "(none)")
          print("Selected version:", candidate_name)
          print("Selected versionCode:", candidate_code)
          print("Selected tag:", tag_for(candidate))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("VERSION_NAME=" + candidate_name + "\n")
              env.write("VERSION_CODE=" + str(candidate_code) + "\n")
              env.write("TAG=" + tag_for(candidate) + "\n")
          PY
          cat gradle/version.properties

      - name: Commit version bump when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/version.properties; then
            echo "Version file already matches $VERSION_NAME."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradle/version.properties
            git commit -m "chore(release): prepare $TAG"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Verify repository version and tag state
        run: |
          set -euo pipefail
          CONFIGURED_NAME="$(grep '^versionName=' gradle/version.properties | cut -d= -f2)"
          CONFIGURED_CODE="$(grep '^versionCode=' gradle/version.properties | cut -d= -f2)"
          test "$CONFIGURED_NAME" = "$VERSION_NAME"
          test "$CONFIGURED_CODE" = "$VERSION_CODE"
          test "$TAG" = "v$VERSION_NAME"
          git fetch --tags --force
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Git tag $TAG already exists on origin."
            exit 1
          fi
          echo "Version state aligned: $VERSION_NAME / $VERSION_CODE / $TAG"
      - name: Validate Production Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is required for release builds."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is required for release builds."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is required for release builds."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is required for release builds."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "ERROR: Production keystore could not be decoded or is empty."
            exit 1
          fi

          if ! keytool -list -keystore app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: Production keystore credentials are invalid or KEY_ALIAS does not exist."
            exit 1
          fi

          echo "KEYSTORE_PATH=keystore.jks" >> "$GITHUB_ENV"
          echo "Production release signing configuration validated."

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Build Release AAB (Android App Bundle)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-configuration-cache

      - name: Verify Artifacts, Signing & Integrity
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK_FILE" || { echo "ERROR: APK missing or empty"; exit 1; }
          test -s "$AAB_FILE" || { echo "ERROR: AAB missing or empty"; exit 1; }

          CONFIGURED_NAME="$(grep "^versionName=" gradle/version.properties | cut -d= -f2)"
          CONFIGURED_CODE="$(grep "^versionCode=" gradle/version.properties | cut -d= -f2)"
          test "$CONFIGURED_NAME" = "$VERSION_NAME"
          test "$CONFIGURED_CODE" = "$VERSION_CODE"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK_FILE" > apk-badging.txt
          grep -F "versionCode='$VERSION_CODE'" apk-badging.txt
          grep -F "versionName='$VERSION_NAME'" apk-badging.txt
          echo "APK version verified: $VERSION_NAME (versionCode $VERSION_CODE)"

          EXPECTED_CERT_SHA1="F5:CD:8C:88:C4:C8:5F:D5:91:84:21:57:06:DA:52:C6:2C:57:D0:37"
          EXPECTED_CERT_SHA1_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in Android SDK build-tools."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE" > apk-cert.txt
          cat apk-cert.txt
          ACTUAL_CERT_SHA1_NORMALIZED="$(sed -n 's/.*certificate SHA-1 digest:[[:space:]]*//p' apk-cert.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_CERT_SHA1_NORMALIZED" ]; then
            echo "ERROR: Could not extract APK signing certificate SHA-1 fingerprint."
            exit 1
          fi
          if [ "$ACTUAL_CERT_SHA1_NORMALIZED" != "$EXPECTED_CERT_SHA1_NORMALIZED" ]; then
            echo "ERROR: APK signing certificate changed. Release signing continuity would be broken."
            echo "Expected: $EXPECTED_CERT_SHA1_NORMALIZED"
            echo "Actual:   $ACTUAL_CERT_SHA1_NORMALIZED"
            exit 1
          fi
          echo "APK signing certificate fingerprint verified: $ACTUAL_CERT_SHA1_NORMALIZED"

          jarsigner -verify -verbose -certs "$AAB_FILE" >/tmp/aab-signature.txt 2>&1 || {
            cat /tmp/aab-signature.txt
            echo "ERROR: AAB signature verification failed"
            exit 1
          }

          cp "$APK_FILE" "release-artifacts/TheHub-${TAG}.apk"
          cp "$AAB_FILE" "release-artifacts/TheHub-${TAG}.aab"
          sha256sum release-artifacts/*

      - name: Create Git Tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "$TAG_COMMIT" = "$HEAD_COMMIT"
          echo "Git tag $TAG points exactly to commit $HEAD_COMMIT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "The Hub ${{ env.TAG }}"
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}