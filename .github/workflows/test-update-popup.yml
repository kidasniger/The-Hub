name: Test Update Popup APK

on:
  push:
    branches:
      - main
    paths:
      - "app/src/main/java/com/thehub/hb/data/repository/UpdateRepository.kt"
      - "app/build.gradle.kts"
      - ".github/workflows/test-update-popup.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build debug APK with update popup test data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug test APK
        run: ./gradlew assembleDebug -PtestUpdatePopup=true --no-configuration-cache --stacktrace

      - name: Verify APK exists and version
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='1.0.180'"


      - name: Upload popup test APK
        uses: actions/upload-artifact@v4
        with:
          name: TheHub-update-popup-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
