name: Android Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "*.gradle.kts"
      - "*.properties"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Compile & run Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: |
          set +e
          ./gradlew lintDebug --no-configuration-cache
          status=$?
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            echo "===== LINT FINDINGS ====="
            grep -E "^[^:]+:[0-9]+:[0-9]+: Error:|^.* Error:" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          fi
          exit $status

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
