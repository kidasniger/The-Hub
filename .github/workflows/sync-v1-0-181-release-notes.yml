name: Sync v1.0.181 release notes

on:
  push:
    paths:
      - ".github/workflows/sync-v1-0-181-release-notes.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'ci: sync v1.0.181 release notes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update existing GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.0.181             --title "The Hub v1.0.181"             --notes-file release-notes/1.0.181.md
