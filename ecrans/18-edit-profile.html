<script>
(function(){
  var t = localStorage.getItem('hubTheme') || 'dark';
  document.documentElement.dataset.theme = t;
  function sync(){ var t2=document.documentElement.dataset.theme;
    document.getElementById('tb-dark').classList.toggle('on', t2==='dark');
    document.getElementById('tb-light').classList.toggle('on', t2==='light'); }
  document.getElementById('tb-dark').onclick=function(){ document.documentElement.dataset.theme='dark'; localStorage.setItem('hubTheme','dark'); sync(); };
  document.getElementById('tb-light').onclick=function(){ document.documentElement.dataset.theme='light'; localStorage.setItem('hubTheme','light'); sync(); };
  sync();
})();
</script>
