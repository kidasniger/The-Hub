<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Une publication The Hub partagée avec vous.">
  <meta property="og:title" content="Publication The Hub">
  <meta property="og:description" content="Ouvrez cette publication dans The Hub.">
  <meta property="og:type" content="website">
  <title>Publication The Hub</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0b0d; color:#fff; }
    main { width:min(92vw,520px); box-sizing:border-box; padding:32px; text-align:center; border:1px solid #2b2b31; border-radius:24px; background:#15151a; }
    h1 { margin:0 0 12px; font-size:28px; }
    p { margin:8px 0; color:#b7b7c0; line-height:1.5; }
    a { display:inline-block; margin-top:20px; padding:12px 18px; border-radius:12px; background:#fff; color:#111; text-decoration:none; font-weight:700; }
    small { display:block; margin-top:16px; color:#777781; word-break:break-all; }
  </style>
</head>
<body>
  <main>
    <h1>📌 Publication The Hub</h1>
    <p>Cette page sert de relais pour ouvrir la publication directement dans l'application.</p>
    <a id="open" href="#">Ouvrir dans The Hub</a>
    <small id="postId"></small>
  </main>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const postId = parts[0] === "post" && parts[1] ? decodeURIComponent(parts[1]) : "";
    const button = document.getElementById("open");
    const label = document.getElementById("postId");
    if (postId) {
      const appLink = "thehub://post/" + encodeURIComponent(postId);
      button.href = appLink;
      label.textContent = "Publication : " + postId;
    } else {
      button.href = "https://github.com/kidasniger/The-Hub/releases/latest";
      button.textContent = "Installer / mettre à jour The Hub";
      label.textContent = "Lien de publication invalide.";
    }
  </script>
</body>
</html>
