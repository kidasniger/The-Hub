<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="The Hub — réseau social, publications partagées et téléchargement de l'application.">
  <meta property="og:site_name" content="The Hub">
  <meta property="og:title" content="The Hub">
  <meta property="og:description" content="Découvrez une publication The Hub ou téléchargez la dernière version de l'application.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/assets/dreamhub-logo-anime.svg">
  <title>The Hub</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -14%,rgba(255,255,255,.1),transparent 38%),#09090b;color:#fff}
    header{width:min(100%,820px);margin:0 auto;padding:20px 18px 8px;display:flex;align-items:center;gap:12px}
    .brand-logo{width:44px;height:44px;border-radius:14px;display:block;object-fit:cover;background:#fff;padding:5px;box-shadow:0 8px 30px rgba(255,255,255,.08)}
    .brand{font-size:23px;font-weight:850;letter-spacing:-.02em}
    main{width:min(94vw,680px);margin:22px auto 52px}
    .card{overflow:hidden;border:1px solid #2a2a30;border-radius:26px;background:rgba(21,21,25,.97);box-shadow:0 28px 90px rgba(0,0,0,.42)}
    .hero{padding:28px 24px 24px;text-align:center}
    .hero-logo{width:86px;height:86px;border-radius:25px;object-fit:cover;background:#fff;padding:8px;margin:0 auto 16px;display:block;box-shadow:0 12px 36px rgba(255,255,255,.1)}
    h1{margin:0 0 8px;font-size:32px;letter-spacing:-.035em}
    .hero p{margin:0;color:#a9a9b2;line-height:1.55}
    .version{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:8px 12px;border-radius:999px;border:1px solid #35353c;background:#1a1a1f;color:#e8e8ed;font-size:13px;font-weight:750}
    .download-panel{margin-top:22px;padding-top:20px;border-top:1px solid #2a2a30}
    .download-title{font-size:20px;font-weight:850}
    .download-meta{margin-top:6px;color:#92929b;font-size:14px}
    .button{border:0;display:flex;width:100%;justify-content:center;align-items:center;padding:15px 18px;border-radius:16px;text-decoration:none;font:inherit;font-weight:850;cursor:pointer}
    .primary{margin-top:16px;background:#fff;color:#111}
    .secondary{margin-top:10px;background:#1c1c22;border:1px solid #37373f;color:#eee}
    .notes{text-align:left;margin-top:18px}
    .notes h2{font-size:15px;margin:0 0 9px}
    .notes ul{margin:0;padding-left:20px;color:#b8b8c1;line-height:1.55}
    .integrity{margin-top:14px;color:#777781;font-size:12px;line-height:1.45;word-break:break-all}
    .post .author{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
    .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#29292f}
    .avatar-fallback{display:grid;place-items:center;font-weight:850}
    .username{font-weight:850;font-size:16px}
    .date{margin-top:4px;color:#878790;font-size:13px}
    .content{padding:6px 20px 20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.58;font-size:17px}
    .media{display:block;width:100%;max-height:640px;object-fit:cover;background:#09090b}
    .video{max-height:640px}
    .stats{display:flex;flex-wrap:wrap;gap:18px;padding:15px 20px;color:#a7a7b0;border-top:1px solid #29292f;font-size:14px}
    .post-actions{padding:18px 20px 8px}
    .loader{padding:20px}
    .skeleton{border-radius:12px;background:linear-gradient(90deg,#1f1f24,#29292f,#1f1f24);background-size:200% 100%;animation:sh 1.15s infinite}
    .s1{height:52px;width:55%;margin-bottom:18px}.s2{height:18px;width:90%;margin-bottom:10px}.s3{height:18px;width:76%;margin-bottom:20px}.s4{height:320px}
    @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .message{text-align:center;padding:44px 24px}
    .message h2{margin:0 0 10px;font-size:25px}
    .message p{margin:0;color:#a6a6af;line-height:1.55}
    footer{text-align:center;color:#686871;font-size:12px;margin-top:16px}
    code{word-break:break-all;color:#cfcfd7}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
    .modal.open{display:flex}
    .modal-card{width:min(92vw,430px);padding:26px;border-radius:24px;border:1px solid #38383f;background:#17171c;box-shadow:0 32px 90px rgba(0,0,0,.55);text-align:center}
    .timer{width:96px;height:96px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center;border:8px solid #34343b;position:relative}
    .timer::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:8px solid transparent;border-top-color:#fff;transform:rotate(-45deg)}
    .seconds{font-size:30px;font-weight:900}
    .modal h2{margin:0 0 7px}.modal p{margin:0;color:#a6a6af;line-height:1.5}
    .cancel{margin-top:16px}
  </style>
</head>
<body>
  <header>
    <img class="brand-logo" src="/assets/dreamhub-logo-anime.svg" alt="Logo The Hub">
    <div class="brand">The Hub</div>
  </header>

  <main id="app">
    <section class="card loader" aria-label="Chargement">
      <div class="skeleton s1"></div>
      <div class="skeleton s2"></div>
      <div class="skeleton s3"></div>
      <div class="skeleton s4"></div>
    </section>
  </main>

  <div id="downloadModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="downloadTitle">
    <div class="modal-card">
      <div class="timer"><span id="seconds" class="seconds">30</span></div>
      <h2 id="downloadTitle">Préparation du téléchargement</h2>
      <p>Le téléchargement de la dernière version va démarrer automatiquement dans <strong id="secondsText">30 s</strong>.</p>
      <button id="cancelDownload" class="button secondary cancel" type="button">Annuler</button>
    </div>
  </div>

  <script>
    const PROJECT_ID = "the-hub-f95f4";
    const RELEASES_URL = "https://api.github.com/repos/kidasniger/The-Hub/releases/latest";
    const FIRESTORE_BASE = "https://firestore.googleapis.com/v1";
    const app = document.getElementById("app");
    const modal = document.getElementById("downloadModal");
    const secondsEl = document.getElementById("seconds");
    const secondsText = document.getElementById("secondsText");
    const cancelBtn = document.getElementById("cancelDownload");
    let latestRelease = null;
    let timerId = null;
    let remaining = 30;

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function firestoreValue(value) {
      if (!value || typeof value !== "object") return null;
      if ("stringValue" in value) return value.stringValue;
      if ("integerValue" in value) return Number(value.integerValue);
      if ("doubleValue" in value) return Number(value.doubleValue);
      if ("booleanValue" in value) return value.booleanValue;
      if ("timestampValue" in value) return value.timestampValue;
      if ("nullValue" in value) return null;
      return null;
    }

    function field(fields, name, fallback) {
      const value = firestoreValue(fields && fields[name]);
      return value == null ? fallback : value;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("fr-FR", { dateStyle: "medium", timeStyle: "short" }).format(date);
    }

    function postIdFromPath() {
      const parts = location.pathname.split("/").filter(Boolean);
      if (parts[0] !== "post" || !parts[1]) return "";
      try { return decodeURIComponent(parts[1]); } catch (_) { return ""; }
    }

    function releaseNotesMarkup(body) {
      const notes = [];
      for (const raw of String(body || "").split("\n")) {
        const line = raw.trim();
        if ((line.startsWith("- ") || line.startsWith("* ")) && !line.includes("**Full Changelog**")) {
          const value = line.slice(2).trim();
          if (value) notes.push(value);
        }
      }
      if (!notes.length) return "";
      return "<div class='notes'><h2>Nouveautés</h2><ul>" +
        notes.slice(0, 12).map(note => "<li>" + esc(note) + "</li>").join("") +
        "</ul></div>";
    }

    async function loadLatestRelease() {
      const response = await fetch(RELEASES_URL, {
        headers: { Accept: "application/vnd.github+json" },
        cache: "no-store"
      });
      if (!response.ok) throw new Error("GitHub releases " + response.status);
      const release = await response.json();
      const apk = Array.isArray(release.assets)
        ? release.assets.find(asset => typeof asset.name === "string" && asset.name.toLowerCase().endsWith(".apk"))
        : null;
      if (!release.tag_name || !apk || !apk.browser_download_url) {
        throw new Error("Latest APK asset unavailable");
      }
      latestRelease = {
        version: String(release.tag_name).replace(/^v/, ""),
        tag: release.tag_name,
        publishedAt: release.published_at || "",
        body: release.body || "",
        url: apk.browser_download_url,
        sizeBytes: Number(apk.size) || 0,
        sizeLabel: Number(apk.size) ? (Number(apk.size) / 1000000).toFixed(1) + " MB" : "",
        sha256: ""
      };

      try {
        const shaAsset = release.assets.find(asset =>
          typeof asset.name === "string" &&
          asset.name.endsWith(".apk.sha256")
        );
        if (shaAsset && shaAsset.browser_download_url) {
          const shaResponse = await fetch(shaAsset.browser_download_url, { cache: "no-store" });
          if (shaResponse.ok) {
            const shaText = (await shaResponse.text()).trim();
            const match = shaText.match(/[a-f0-9]{64}/i);
            latestRelease.sha256 = match ? match[0] : "";
          }
        }
      } catch (_) {
        // SHA-256 is informational; downloading the release remains available.
      }

      return latestRelease;
    }

    function downloadPanel(release) {
      if (!release) return "";
      const meta = [
        release.sizeLabel,
        release.publishedAt ? formatDate(release.publishedAt) : ""
      ].filter(Boolean).join(" · ");

      return `
        <section class="download-panel">
          <div class="download-title">Télécharger The Hub</div>
          <div class="download-meta">Dernière version : <strong>v${esc(release.version)}</strong>${meta ? " · " + esc(meta) : ""}</div>
          <button class="button primary" type="button" data-download>⬇️ Télécharger l’APK</button>
          ${releaseNotesMarkup(release.body)}
          ${release.sha256 ? "<div class='integrity'>SHA-256 : <code>" + esc(release.sha256) + "</code></div>" : ""}
        </section>`;
    }

    function showHome(release) {
      document.title = "The Hub · Télécharger";
      app.innerHTML = `
        <section class="card hero">
          <img class="hero-logo" src="/assets/dreamhub-logo-anime.svg" alt="Logo The Hub">
          <h1>The Hub</h1>
          <p>La dernière version de l’application est récupérée automatiquement depuis la release officielle.</p>
          ${release ? "<div class='version'>● v" + esc(release.version) + " disponible</div>" : ""}
          ${release ? downloadPanel(release) : "<div class='download-panel'><div class='download-title'>Téléchargement indisponible</div><div class='download-meta'>Impossible de récupérer la dernière release pour le moment.</div></div>"}
        </section>
        <footer>Le site The Hub vérifie automatiquement la dernière version disponible.</footer>`;
      bindDownloadButtons();
    }

    function showMessage(title, message) {
      app.innerHTML = `
        <section class="card message">
          <h2>${esc(title)}</h2>
          <p>${esc(message)}</p>
          ${latestRelease ? downloadPanel(latestRelease) : ""}
        </section>`;
      bindDownloadButtons();
    }

    function renderPost(data, postId, release) {
      const fields = data.fields || {};
      const username = String(field(fields, "authorUsername", "thehub_user"));
      const authorPhoto = String(field(fields, "authorPhotoUrl", ""));
      const text = String(field(fields, "text", ""));
      const imageUrl = String(field(fields, "imageUrl", ""));
      const videoUrl = String(field(fields, "videoUrl", ""));
      const createdAt = String(field(fields, "createdAt", ""));
      const likes = Number(field(fields, "likesCount", 0)) || 0;
      const comments = Number(field(fields, "commentsCount", 0)) || 0;
      const reposts = Number(field(fields, "repostsCount", 0)) || 0;
      const hidden = field(fields, "isHidden", false) === true;
      const deleted = field(fields, "isDeletedByAdmin", false) === true;

      if (hidden || deleted) {
        showMessage("Publication indisponible", "Cette publication n’est plus disponible publiquement.");
        return;
      }

      const avatar = authorPhoto && /^https?:\/\//i.test(authorPhoto)
        ? '<img class="avatar" src="' + esc(authorPhoto) + '" alt="">'
        : '<div class="avatar avatar-fallback">' + esc(username.trim().charAt(0).toUpperCase() || "T") + '</div>';

      let media = "";
      if (/^https?:\/\//i.test(imageUrl)) {
        media = '<img class="media" src="' + esc(imageUrl) + '" alt="Image de la publication" loading="eager">';
      } else if (/^https?:\/\//i.test(videoUrl)) {
        media = '<video class="media video" src="' + esc(videoUrl) + '" controls playsinline preload="metadata"></video>';
      }

      document.title = username + " · The Hub";
      document.querySelector('meta[name="description"]').setAttribute(
        "content",
        text.replace(/\s+/g, " ").trim().slice(0, 180) || "Publication partagée sur The Hub"
      );
      if (authorPhoto && /^https?:\/\//i.test(authorPhoto)) {
        let og = document.querySelector('meta[property="og:image"]');
        if (!og) {
          og = document.createElement("meta");
          og.setAttribute("property", "og:image");
          document.head.appendChild(og);
        }
        og.setAttribute("content", authorPhoto);
      }

      const appLink = "thehub://post/" + encodeURIComponent(postId);

      app.innerHTML = `
        <article class="card post">
          <div class="author">
            ${avatar}
            <div>
              <div class="username">${esc(username)}</div>
              <div class="date">${esc(formatDate(createdAt))}</div>
            </div>
          </div>
          ${text ? "<div class='content'>" + esc(text) + "</div>" : ""}
          ${media}
          <div class="stats">
            <span>❤️ ${likes} J’aime</span>
            <span>💬 ${comments} commentaires</span>
            <span>🔁 ${reposts} republications</span>
          </div>
          <div class="post-actions">
            <a class="button primary" href="${appLink}">Ouvrir dans The Hub</a>
          </div>
          ${release ? downloadPanel(release) : ""}
        </article>
        <footer>Publication <code>${esc(postId)}</code> · The Hub</footer>`;
      bindDownloadButtons();
    }

    async function loadPost(postId, release) {
      const url = FIRESTORE_BASE +
        "/projects/" + encodeURIComponent(PROJECT_ID) +
        "/databases/(default)/documents/posts/" + encodeURIComponent(postId);

      const response = await fetch(url, {
        method: "GET",
        headers: { Accept: "application/json" },
        cache: "no-store"
      });
      const body = await response.json().catch(function(){ return {}; });

      if (response.status === 404) {
        showMessage("Publication introuvable", "Cette publication n'existe plus ou le lien est incorrect.");
        return;
      }
      if (!response.ok) {
        const code = body && body.error && (body.error.status || body.error.message);
        console.error("The Hub public preview error:", code || response.status);
        showMessage(
          "Aperçu indisponible",
          code === "PERMISSION_DENIED"
            ? "La lecture publique de cette publication n'est pas disponible."
            : "Impossible de charger cette publication pour le moment."
        );
        return;
      }
      renderPost(body, postId, release);
    }

    function startDownload() {
      if (!latestRelease || !latestRelease.url) {
        alert("Le téléchargement n’est pas disponible pour le moment.");
        return;
      }

      clearInterval(timerId);
      remaining = 30;
      secondsEl.textContent = String(remaining);
      secondsText.textContent = remaining + " s";
      modal.classList.add("open");

      timerId = setInterval(function() {
        remaining -= 1;
        secondsEl.textContent = String(Math.max(remaining, 0));
        secondsText.textContent = Math.max(remaining, 0) + " s";
        if (remaining <= 0) {
          clearInterval(timerId);
          modal.classList.remove("open");
          window.location.href = latestRelease.url;
        }
      }, 1000);
    }

    function cancelDownload() {
      clearInterval(timerId);
      timerId = null;
      remaining = 30;
      modal.classList.remove("open");
    }

    function bindDownloadButtons() {
      document.querySelectorAll("[data-download]").forEach(function(button) {
        button.addEventListener("click", startDownload);
      });
    }

    cancelBtn.addEventListener("click", cancelDownload);
    modal.addEventListener("click", function(event) {
      if (event.target === modal) cancelDownload();
    });

    (async function() {
      const postId = postIdFromPath();
      try {
        const releasePromise = loadLatestRelease();
        const release = await releasePromise;
        if (!postId) {
          showHome(release);
          return;
        }
        await loadPost(postId, release);
      } catch (error) {
        console.error("The Hub site error:", error);
        if (!postId) {
          showHome(null);
        } else {
          showMessage("Aperçu indisponible", "Impossible de récupérer les informations de la publication ou de la dernière version.");
        }
      }
    })();
  </script>
</body>
</html>
